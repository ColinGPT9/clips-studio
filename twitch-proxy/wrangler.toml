name = "clips-kitty-twitch"
main = "worker.js"
compatibility_date = "2026-01-01"

# Free Workers Logs — `npx wrangler tail` shows live traffic and abuse.
[observability]
enabled = true

[vars]
# Which pages may use this proxy, comma separated, no trailing slash.
#
# LEAVE THIS SET. Empty means "any origin", which is fine while developing
# against localhost and wrong in production — an open proxy is somebody else's
# free bandwidth on your Cloudflare account.
#
# Add the real domain here once the web app has one, alongside or instead of
# the vercel.app address.
# Entries may contain `*`, which matches within a single hostname label.
#
# The wildcard is not laziness. Vercel mints a NEW HOSTNAME FOR EVERY
# DEPLOYMENT — previews, and the per-deployment URL behind the production
# alias — so a literal list is correct only until the next push, and then
# Twitch breaks again with this exact error.
#
# Trade worth knowing: the second pattern would also match a Vercel project
# someone else names `clips-kitty-web-…` under their own account. That costs a
# stranger's traffic against this worker's free request budget and takes
# deliberate targeting, whereas breaking on every deploy is a certainty. See
# README.md for the HMAC upgrade if it is ever actually abused.
#
# Localhost needs no entry — any localhost/127.0.0.1 origin is allowed in code,
# on any port. Add a custom domain here as one more comma-separated entry.
ALLOWED_ORIGINS = "https://clips-kitty-web.vercel.app,https://clips-kitty-web-*.vercel.app"
