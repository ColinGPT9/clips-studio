name: AutoShorts
description: Python tool that scores long gameplay recordings by audio and motion, optionally with AI analysis, and renders vertical shorts with captions and an optional voiceover.
section: gaming
relationship: related
license: MIT
license_note: It credits Binary-Bytes/Auto-YouTube-Shorts-Maker as a base, and that project has no licence file.
source:
  github: https://github.com/divyaprakash0426/autoshorts
models:
  - huggingface: Qwen/Qwen3-TTS-12Hz-1.7B-VoiceDesign
runs: both
tags: [gaming, highlights, captions, gpu, voiceover]
warning: Its example settings upload the whole video to Google Gemini for analysis; set AI_PROVIDER=local to keep everything on your PC.
