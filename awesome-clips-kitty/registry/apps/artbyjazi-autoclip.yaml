name: AutoClip
description: Local-first app with a web UI and CLI that turns a long video into ranked vertical, square or wide clips with burned-in captions and speaker-tracked reframing, using faster-whisper, Ollama and MediaPipe.
section: video-clipping
relationship: related
license: MIT
license_note: 'Optional speaker diarization uses gated pyannote models: sign in to Hugging Face and accept their terms first.'
source:
  github: https://github.com/artbyjazi/autoclip
platforms: [windows]
runs: both
tags: [shorts, ollama, reframing, captions, whisper]
warning: Downloads YouTube videos with yt-dlp and suggests browser cookies to get past bot checks; YouTube's terms may not allow it for videos you don't own.
