name: Open Clipper
description: Windows desktop app that transcribes long videos locally, reframes them to vertical with GPU face and subject tracking, styles captions and batch-exports. Clip picking is done by an outside AI agent over MCP.
section: video-clipping
relationship: related
license: MIT
license_note: The bundled InsightFace SCRFD face weights are for non-commercial research only; commercial distribution needs other weights. The YOLOX-S and MoveNet weights are Apache-2.0.
source:
  github: https://github.com/GrepCut/OpenClipper
platforms: [windows]
runs: both
tags: [reframing, captions, mcp, face tracking, whisper]
