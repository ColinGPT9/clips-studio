name: pyVideoTrans
description: 'Desktop app that translates videos end to end: it transcribes speech, translates subtitles, creates dubbed voices and puts them back into the video. It can run locally with faster-whisper and Ollama.'
section: video-ai
relationship: related
license: GPL-3.0
source:
  github: https://github.com/jianchang512/pyvideotrans
platforms: [windows, macos, linux]
runs: both
tags: [dubbing, translation, tts, subtitles, voice cloning]
warning: By default it sends subtitle text to Google for translation and to Microsoft's online Edge-TTS voice service for dubbing.
added: 2026-10-07
checked: 2026-10-07
