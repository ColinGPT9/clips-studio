name: Whisper-WebUI
description: Browser app for making SRT, WebVTT or text subtitles with faster-whisper, with voice detection, background-music removal, speaker labels and translation. It has an optional REST API.
section: video-ai
relationship: related
license: Apache-2.0
license_note: 'The default NLLB translation model is CC-BY-NC-4.0 (non-commercial). Speaker labels use the gated pyannote model: sign in to Hugging Face and accept its terms first.'
source:
  github: https://github.com/jhj0517/Whisper-WebUI
models:
  - huggingface: facebook/nllb-200-1.3B
  - huggingface: pyannote/speaker-diarization-3.1
runs: both
tags: [subtitles, whisper, diarization, translation, gradio]
warning: Can download YouTube videos to transcribe them; YouTube's terms may not allow it for videos you don't own.
added: 2026-10-07
checked: 2026-10-07
