name: HotClip
description: Desktop app that finds highlights in long videos and livestream VODs from the transcript, loudness, shots, faces and chat, then exports captioned vertical clips. Transcribes locally and can use Ollama.
section: video-clipping
relationship: related
license: AGPL-3.0-only
source:
  github: https://github.com/xixihhhh/hotclip
platforms: [windows, macos, linux]
runs: both
tags: [livestream, vod, chat, bilibili, mcp]
warning: Sends transcripts to Atlas Cloud by default unless set to Ollama. Downloads Bilibili and YouTube videos, which their terms may not allow. Its anti-fingerprint feature dodges repost checks.
