name: VideoLingo
description: App that transcribes, splits, translates and dubs videos into subtitles and voice-overs, using local speech recognition and an LLM you choose. It has a local HTTP API for scripted runs.
section: video-ai
relationship: related
license: Apache-2.0
source:
  github: https://github.com/Huanshere/VideoLingo
runs: both
tags: [dubbing, translation, subtitles, tts, streamlit]
warning: By default sends subtitle text to the paid OpenLux LLM relay and, for dubbing, to Microsoft's Edge TTS. Downloads YouTube videos; YouTube's terms may not allow it for videos you don't own.
added: 2026-10-07
checked: 2026-10-07
