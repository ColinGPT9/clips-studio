name: OpenClip
description: Python tool with a web UI and CLI that transcribes long videos, asks an LLM to rank the most engaging moments and cuts clips with subtitles, titles and covers.
section: video-clipping
relationship: related
license: MIT
license_note: Optional speaker identification uses the gated pyannote/speaker-diarization-community-1 model; sign in to Hugging Face and accept its terms first. Whisper and Paraformer weights come under their own licences.
source:
  github: https://github.com/linzzzzzz/openclip
models:
  - huggingface: pyannote/speaker-diarization-community-1
platforms: [windows, macos, linux]
runs: both
tags: [llm, subtitles, highlights, livestream, bilibili]
warning: Sends transcripts to Alibaba's Qwen API by default to pick moments. Downloads from YouTube and Bilibili, whose terms may not allow it for videos you don't own.
added: 2026-10-07
checked: 2026-10-07
