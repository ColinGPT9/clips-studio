name: AutoClip
description: Desktop and web app that turns podcasts, interviews and courses into shorts with captions, covers and post text. It can transcribe with local Whisper or SenseVoice and pick moments with Ollama or LM Studio.
section: video-clipping
relationship: related
license: MIT
source:
  github: https://github.com/zhouxiaoka/autoclip
platforms: [windows, macos, web]
runs: both
tags: [podcast, shorts, captions, ollama, desktop]
warning: Sends usage analytics (PostHog) and crash reports (Sentry) by default; turn off in Settings. Downloads videos from YouTube and other sites, which their terms may not allow.
added: 2026-10-07
checked: 2026-10-07
