name: Twitchat
description: Browser-based Twitch chat for streamers with moderation, alerts, a clip command and triggers that can control OBS or make HTTP calls when chat or stream events happen.
section: streaming
relationship: related
license: GPL-3.0
license_note: The hosted twitchat.fr app limits how many triggers non-premium users can create.
source:
  github: https://github.com/Durss/Twitchat
platforms: [web]
runs: both
tags: [twitch, chat, obs, triggers, alerts]
warning: The main version runs on twitchat.fr and signs in with your Twitch account; self-hosting needs your own Twitch app.
added: 2026-10-07
checked: 2026-10-07
