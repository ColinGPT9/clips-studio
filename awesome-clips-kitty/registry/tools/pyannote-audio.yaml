name: pyannote.audio
description: Python toolkit that works out who spoke when in a recording, with speech activity, speaker change and overlap detection. Useful for cutting podcast clips at speaker turns and following the active speaker.
section: media
relationship: related
license: MIT
license_note: Pretrained pipelines on Hugging Face have their own licences and are often gated; the default community-1 pipeline is CC-BY-4.0 and needs sign-in, accepted terms and a token.
source:
  github: https://github.com/pyannote/pyannote-audio
models:
  - huggingface: pyannote/speaker-diarization-community-1
runs: both
tags: [diarization, speakers, podcast, voice activity]
warning: Sends anonymous usage metrics (pipeline origin, file duration, speaker-count settings) by default; set PYANNOTE_METRICS_ENABLED=0 to turn it off.
added: 2026-10-07
checked: 2026-10-07
