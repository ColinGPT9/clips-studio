name: Streamlink
description: Captures live streams and VODs from Twitch, Kick, YouTube and many other services and saves them to a file you can clip, or plays them in your video player. Command-line tool and Python library.
section: streams
relationship: related
license: BSD-2-Clause
source:
  github: https://github.com/streamlink/streamlink
platforms: [windows, macos, linux]
runs: local
tags: [twitch, kick, live, recording, stream capture]
warning: Records streams and VODs from Twitch, Kick, YouTube and other sites; their terms may not allow it, and its Kick plugin solves a browser challenge that Kick's terms forbid bypassing.
