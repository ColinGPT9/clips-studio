name: LLM-Subtrans
description: Translates SRT, ASS and VTT subtitle files with large language models through a desktop app or command line, and can also transcribe audio. Works with cloud AI providers or a local OpenAI-compatible server such as Ollama.
section: translation
relationship: related
license: MIT
source:
  github: https://github.com/machinewrapped/llm-subtrans
runs: both
tags: [subtitles, translation, ollama, srt]
warning: Sends subtitles, and audio when transcribing, to OpenRouter by default or another cloud AI provider you pick, unless you use a local server or Qwen Local.
