name: T-DEED
description: Spots the exact frames where events happen in sports video (soccer, tennis, diving, gymnastics, figure skating) and writes them with timestamps to JSON. Research code with checkpoints; needs an NVIDIA GPU.
section: sports
relationship: related
license: GPL-3.0
license_note: Checkpoints are on Google Drive with no stated licence and were trained on data with its own terms (FineGym is non-commercial; SoccerNet video is behind an NDA). Code adapted from E2E-Spot keeps a BSD-3-Clause notice.
source:
  github: https://github.com/arturxe2/T-DEED
runs: local
tags: [event spotting, action spotting, soccer, tennis, pytorch]
sports: [soccer, tennis]
added: 2026-10-07
checked: 2026-10-07
