name: yt-dlp
description: Command-line downloader for video and audio from thousands of sites, including Twitch and Kick, that can also save YouTube live chat. Use it to fetch a VOD or clip you have rights to before clipping it.
section: streams
relationship: related
license: Unlicense
license_note: The repository and PyPI packages are Unlicense, but the standalone executables such as yt-dlp.exe bundle GPLv3+ code, so those binaries are GPLv3+ as a whole.
source:
  github: https://github.com/yt-dlp/yt-dlp
platforms: [windows, macos, linux]
runs: local
tags: [downloader, youtube, twitch, kick, live chat]
warning: Downloads videos from YouTube, Twitch, Kick and many other sites; their terms may not allow it for videos you don't own.
