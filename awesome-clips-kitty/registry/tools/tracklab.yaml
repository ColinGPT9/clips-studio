name: TrackLab
description: A modular framework that chains detectors, pose estimators, re-identification models and trackers to follow people or objects through a video. Its track data can drive player-following vertical crops.
section: vision
relationship: related
license: MIT
license_note: Installing it pulls in Ultralytics as a required dependency, which is AGPL-3.0 (or a paid Ultralytics licence); vendored code in plugins/ keeps its own licences.
source:
  github: https://github.com/TrackingLaboratory/tracklab
runs: local
tags: [tracking, multi-object tracking, pose, re-identification, reframing]
warning: Given a web address, it downloads the video with yt-dlp, and its sample config suggests a YouTube link; YouTube's terms may not allow it. Use local files.
added: 2026-10-07
checked: 2026-10-07
