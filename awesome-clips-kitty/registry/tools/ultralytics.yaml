name: Ultralytics YOLO
description: Python library and command line for YOLO object detection, segmentation and pose estimation that can also track people and objects across video frames. A common base for keeping a subject in frame when reframing.
section: vision
relationship: related
license: AGPL-3.0-or-later
license_note: Any plugin that imports it must be AGPL-compatible open source unless you buy an Ultralytics Enterprise licence. Trained models are AGPL-3.0 by default.
source:
  github: https://github.com/ultralytics/ultralytics
models:
  - huggingface: Ultralytics/YOLO26
runs: local
tags: [object detection, tracking, yolo, reframing, pose]
warning: Sends anonymized analytics and crash reports by default (yolo settings sync=False turns them off). Accepts YouTube links as input, which YouTube's terms may not allow.
added: 2026-10-07
checked: 2026-10-07
