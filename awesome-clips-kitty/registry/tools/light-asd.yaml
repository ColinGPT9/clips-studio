name: Light-ASD
description: Detects which visible face is speaking, using both the audio and the picture, with a demo for your own videos. Useful for keeping vertical crops on the speaker; the authors' newer LR-ASD extends it.
section: vision
relationship: related
license: MIT
license_note: The demo's S3FD face detector code has no licence and its weights come from Google Drive with no stated licence; swap in a licensed face detector before reusing the demo pipeline.
source:
  github: https://github.com/Junhua-Liao/Light-ASD
runs: local
tags: [active speaker, face, speaker tracking, reframing]
warning: Its Columbia evaluation script downloads a test video from YouTube with youtube-dl; YouTube's terms may not allow it. The demo on your own videos uses local files.
added: 2026-10-07
checked: 2026-10-07
