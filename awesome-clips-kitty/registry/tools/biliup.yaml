name: biliup
description: Records live streams and their danmaku chat from Bilibili, Douyin, Twitch, YouTube and other sites around the clock, with a web UI to cut segments and upload them to Bilibili.
section: streams
relationship: related
license: MIT
license_note: The LICENSE file is MIT, but the README's disclaimer says the project is for personal learning and research only and that commercial use is prohibited.
source:
  github: https://github.com/biliup/biliup
platforms: [windows, macos, linux]
runs: local
tags: [stream recording, twitch, bilibili, danmaku, upload]
warning: Records streams from Twitch, YouTube, Douyin and other sites, whose terms may not allow it for streams you don't own; uploads use your Bilibili login.
