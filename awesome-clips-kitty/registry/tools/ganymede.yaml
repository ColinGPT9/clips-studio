name: Ganymede
description: Self-hosted server that archives Twitch VODs and live streams together with their chat, including a rendered chat video, in a plain file layout that works without it.
section: streams
relationship: related
license: GPL-3.0
source:
  github: https://github.com/Zibbp/ganymede
platforms: [linux]
runs: local
tags: [twitch, vod, chat, archive, docker]
warning: Downloads Twitch VODs, live streams and chat, which Twitch's terms may not allow for channels you don't own; an optional proxy setting is built to archive live streams without ads.
