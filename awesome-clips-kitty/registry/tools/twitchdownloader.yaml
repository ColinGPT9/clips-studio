name: TwitchDownloader
description: Downloads Twitch VODs, clips and chat (as JSON, HTML or text) and can render the chat into a video. A Windows app plus a cross-platform command-line version.
section: streams
relationship: related
license: MIT
license_note: Release binaries bundle third-party parts, including FFmpeg (GPLv2) and Xabe.FFmpeg.Downloader, whose terms include CC BY-NC-SA 3.0 (non-commercial), so redistributing them carries more than MIT duties.
source:
  github: https://github.com/lay295/TwitchDownloader
platforms: [windows, linux, macos]
runs: local
tags: [twitch, vod, chat, chat render, downloader]
warning: Downloads VODs, clips and chat from Twitch through an unofficial API; Twitch's terms do not allow automated downloading. For your own VODs, use Twitch's own download option.
added: 2026-10-07
checked: 2026-10-07
