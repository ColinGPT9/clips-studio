name: Lighthouse
description: Finds the moments in a video that match a text query, such as a goal or people laughing, and scores each part for how highlight-worthy it is. Videos longer than 150 seconds must be split first.
section: clipping
relationship: related
license: Apache-2.0
license_note: Pre-trained weights download separately from Google Drive and Zenodo with no stated licence, and were trained on datasets with non-commercial annotation terms (QVHighlights is CC BY-NC-SA 4.0).
source:
  github: https://github.com/line/lighthouse
runs: local
tags: [moment retrieval, highlight detection, text query, saliency]
