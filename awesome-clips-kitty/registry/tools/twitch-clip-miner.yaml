name: Twitch AI Clip Miner
description: Finds highlights in Twitch VODs or local videos by combining loudness peaks, hype words and laughter in the transcript, chat speed and facial emotion. Exports the best clips, optionally as vertical video.
section: clipping
relationship: related
license: MIT
source:
  github: https://github.com/jamesbaughnd/twitch-clip-miner
runs: local
tags: [twitch, chat, laughter, highlights, vod]
warning: Downloads Twitch VODs and chat with yt-dlp and TwitchDownloaderCLI; Twitch's terms may not allow it for VODs you don't own.
