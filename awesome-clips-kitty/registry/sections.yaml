# The table of contents: each kind's sections, in the order README.md and the
# Marketplace show them. An entry names one section id. A section with
# "relationship" only takes entries with that relationship. A section with no
# entries is left out of README.md. "wanted" lists niches nobody has filled
# yet: ideas for developers, shown as such, never as projects that exist.

app:
  sections:
    - id: built-with
      title: Built with Clips Kitty
      description: Complete applications that use the Clips Kitty API or SDK.
      relationship: built-with

pipeline:
  sections:
    - id: general
      title: General
      description: Pipelines for any kind of video.
    - id: gaming
      title: Gaming
    - id: gaming/generic
      title: Any game
    - id: gaming/world-of-warcraft
      title: World of Warcraft
    - id: gaming/marvel-rivals
      title: Marvel Rivals
    - id: gaming/minecraft
      title: Minecraft
    - id: gaming/valorant
      title: Valorant
    - id: gaming/league-of-legends
      title: League of Legends
    - id: gaming/counter-strike
      title: Counter-Strike
    - id: gaming/rocket-league
      title: Rocket League
    - id: gaming/fortnite
      title: Fortnite
    - id: sports
      title: Sports
    - id: sports/soccer
      title: Soccer
    - id: sports/basketball
      title: Basketball
    - id: sports/hockey
      title: Ice hockey
    - id: sports/american-football
      title: American football
    - id: creators
      title: Creators
      description: Vlogs, IRL streams, reactions and just-chatting.
    - id: podcasts
      title: Podcasts and talk
  wanted:
    - section: gaming/generic
      idea: Game events for genres the big clipping apps barely cover, such as fighting games, racing, strategy, card games, MMOs, and retro or emulated games.
    - section: gaming/world-of-warcraft
      idea: PvP, Mythic+ and raid highlights, each knowing what a great moment looks like in that mode.
    - section: gaming/marvel-rivals
      idea: Team fights, multi-kills and ultimates.
    - section: gaming/minecraft
      idea: Builds, near-deaths and boss fights.
    - section: gaming/valorant
      idea: Clutches and aces.
    - section: gaming/league-of-legends
      idea: Team fights and objective steals.
    - section: gaming/rocket-league
      idea: Goals, saves and aerials.
    - section: sports/hockey
      idea: Goals, saves and fights from NHL-style broadcasts.

