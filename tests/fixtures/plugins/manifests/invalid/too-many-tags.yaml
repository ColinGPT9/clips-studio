# expect: tags: at most 10 tags
manifest_version: 1
id: example-dev/loud-moments
name: Loud moments
version: 1.0.0
kind: pipeline
capability: highlight_detection
description: Picks the loudest stretches of a video.
license: MIT
requires: {clips_kitty: '>=2.0', plugin_api: 1}
run:
  command: ['{python}', src/main.py]
execution: local
inputs: [video]
outputs: [ranges]
permissions: [video.read, ffmpeg]
tags: [tag-0, tag-1, tag-2, tag-3, tag-4, tag-5, tag-6, tag-7, tag-8, tag-9, tag-10]
