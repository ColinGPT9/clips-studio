# expect: run.command[1]: '../other/main.py' must be a script inside the plugin's folder
manifest_version: 1
id: example-dev/loud-moments
name: Loud moments
version: 1.0.0
kind: pipeline
capability: highlight_detection
description: Picks the loudest stretches of a video.
license: MIT
requires: {clips_kitty: '>=2.0', plugin_api: 1}
run:
  command: ['{python}', ../other/main.py]
execution: local
inputs: [video]
outputs: [ranges]
permissions: [video.read, ffmpeg]
