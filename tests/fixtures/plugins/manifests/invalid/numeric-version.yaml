# expect: version: YAML read this as the number 0.1; write a version like 0.1.0
manifest_version: 1
id: example-dev/loud-moments
name: Loud moments
version: 0.1
kind: pipeline
capability: highlight_detection
description: Picks the loudest stretches of a video.
license: MIT
requires: {clips_kitty: '>=2.0', plugin_api: 1}
run:
