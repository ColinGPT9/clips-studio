# expect: models[0].revision: must be the full 40-character commit hash
manifest_version: 1
id: example-dev/loud-moments
name: Loud moments
version: 1.0.0
kind: pipeline
capability: highlight_detection
description: Picks the loudest stretches of a video.
license: MIT
requires: {clips_kitty: '>=2.0', plugin_api: 1}
run:
  command: ['{python}', src/main.py]
execution: local
inputs: [video]
outputs: [ranges]
permissions: [video.read, ffmpeg]
models:
- name: detector
  source: huggingface
  id: example-org/example-model
  revision: main
  files: [detector.onnx]
  format: onnx
  license: apache-2.0
