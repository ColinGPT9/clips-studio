# A test plugin: rates the moments it is handed and says what happens in them,
# as its settings say, or fails the way it is told to, so the engine's handling
# of every answer can be checked (tests/test_plugin_steps.py). It knows
# Quarkbloom Arena, a made-up game.
manifest_version: 1
id: fixture-dev/stepper
name: Stepper
version: 1.0.0
kind: pipeline
capability: highlight_detection
description: Rates and describes moments of a Quarkbloom Arena (a made-up game) match as it is told to.
author: {name: Fixture Developer}
license: MIT
requires: {clips_kitty: ">=2.0", plugin_api: 1}
run:
  command: ["{python}", "src/main.py"]
  timeout_minutes: 5
execution: local
inputs: [transcript, moments]
outputs: [context, ratings]
settings:
  mode: {type: choice, options: [ok, fail, bad, unknown_ids, ranges, sleep], default: ok, title: What to do}
  scores: {type: string, default: "", title: "Scores as id=score or id=+points, comma separated; * for every moment"}
  notes: {type: string, default: "", title: "Notes as id=note|note, comma separated; * for every moment"}
  message: {type: string, default: "the arena feed could not be read", title: The error line in fail mode}
  trace: {type: string, default: "", title: A file to add a line to for each run}
permissions: [transcript.read]
network: []
sends: []
category: utilities
tags: [test]
