# Sports (sports/, docs/SPORTS.md): what a sport's moments are, how much each
# is worth, how much of the play around it a clip keeps, and the words that
# mark it. Used only when a job has the Sports toggle on; a video clipped
# without it never reads this file.
#
# One entry per sport. Adding a sport is an entry here, a sports/<name>/
# package for anything it needs in code, and a line in sports/__init__.py.
#
# Sources for the numbers: HypeCut's televised-sport profile (crowd roar is
# the strongest cue and must last ~2.5 s; 6 s of pre-roll because "the
# build-up is the story"), MatchVision's 30 s event windows (15 s either
# side), SoccerReplay-1988's 24 event types, and what Veo, WSC Sports and
# Spiideo document about their own event lists. See docs/SPORTS.md.

soccer:
  label: Soccer

  # How the prompts describe a highlight in this sport (their {mode_guidance}).
  highlights: >-
    goals (with the attack that led to them and the celebration), saves, penalties
    scored and missed, red cards, big chances and misses off the post or the bar,
    VAR decisions, last-minute drama and comebacks

  # Crowd noise arrives after the moment: the ball goes in, then the stadium
  # roars. A moment found by its roar is dated this many seconds earlier.
  crowd_lag_seconds: 1.5

  # A replay shown within this many seconds after a moment is the same moment.
  replay_within_seconds: 90
  # What commentators say over a replay: a second "goal" moment soon after the
  # first, with no new score, is the same goal shown again.
  replay_words: [replay, replays, "see it again", "watch it again", "show it again", "there it is again",
                 "one more time", "another angle", "look at it again", "slow motion", "in slow-mo",
                 repetición, "otra vez", "de nuevo", "au ralenti", "noch einmal", zeitlupe, rivediamo]

  # Each kind of moment: its label, how much it is worth (0-100) and how many
  # seconds of play a clip keeps before and after it. The clip also stays
  # within the job's clip length.
  events:
    goal:         {label: Goal,            importance: 100, pre: 14, post: 10}
    penalty_goal: {label: Penalty goal,    importance: 100, pre: 10, post: 10}
    own_goal:     {label: Own goal,        importance: 95,  pre: 12, post: 10}
    red_card:     {label: Red card,        importance: 85,  pre: 8,  post: 10}
    penalty_miss: {label: Missed penalty,  importance: 85,  pre: 10, post: 8}
    save:         {label: Save,            importance: 80,  pre: 8,  post: 6}
    chance:       {label: Big chance,      importance: 75,  pre: 10, post: 6}
    var:          {label: VAR check,       importance: 70,  pre: 6,  post: 12}
    penalty:      {label: Penalty awarded, importance: 70,  pre: 10, post: 8}
    big_moment:   {label: Big moment,      importance: 60,  pre: 10, post: 8}
    shot:         {label: Shot,            importance: 50,  pre: 8,  post: 5}
    yellow_card:  {label: Yellow card,     importance: 45,  pre: 6,  post: 8}
    free_kick:    {label: Free kick,       importance: 40,  pre: 4,  post: 8}
    corner:       {label: Corner,          importance: 35,  pre: 3,  post: 8}
    offside:      {label: Offside,         importance: 30,  pre: 8,  post: 4}
    injury:       {label: Injury,          importance: 20,  pre: 6,  post: 6}
    substitution: {label: Substitution,    importance: 15,  pre: 3,  post: 6}
    kickoff:      {label: Kick-off,        importance: 10,  pre: 2,  post: 8}
    halftime:     {label: Half-time,       importance: 10,  pre: 6,  post: 4}
    fulltime:     {label: Full-time,       importance: 10,  pre: 8,  post: 6}

  # What the commentary says when each happens, in the main football
  # languages. A whole word or phrase, ignoring case; `patterns` are regular
  # expressions for the shouted forms ("GOOOAL"). A moment the commentary
  # names and a second signal agrees on is typed as that moment; one only the
  # crowd and the voice mark is a "big moment", never a guessed type.
  # Left out on purpose: plain "goal" ("goal kick", "a shot on goal"), the
  # French "but" (every English "but") and the German "Tor" ("aufs Tor"):
  # the shouted forms under `patterns` catch the real thing.
  callouts:
    goal: [scores, scored, "he scores", "she scores", "what a goal", "back of the net", "into the net",
           "in the net", equaliser, equalizer, "hat-trick", "hat trick", gol, golazo, "gol de",
           "il marque", "a marqué", "ha segnato", "tor für", doelpunt]
    own_goal: ["own goal", "own-goal", autogol, autogoal, "gol en propia", "gol contra",
               "contre son camp", "csc", eigentor, autorete]
    penalty: [penalty, "spot kick", "from the spot", penalti, "pênalti", "pénalty", elfmeter, rigore,
              "tiro de penal"]
    penalty_miss: ["misses the penalty", "penalty saved", "saves the penalty", "penalty missed",
                   "falló el penalti", "falla el penal", "pênalti perdido", "elfmeter verschossen",
                   "rigore sbagliato", "tir au but manqué"]
    save: [save, saves, saved, "what a save", "great save", "brilliant save",
           "tipped over", "tipped wide", parada, paradón, atajada, "que parada", defesa,
           defendeu, "arrêt", parade, gehalten, "pariert", parata, "che parata"]
    chance: [chance, "big chance", "so close", "off the post", "hits the post", "the post", "the bar",
             crossbar, woodwork, "just wide", "over the bar", "inches wide", "how has he missed",
             "misses", ocasión, "al palo", travesaño, trave, "na trave", poteau, "barre transversale",
             pfosten, latte, palo]
    shot: [shoots, "shot from", "strikes it", "fires it", "lets fly", disparo, remate, frappe,
           schuss, tiro]
    red_card: ["red card", "sent off", "straight red", "second yellow", "marching orders",
               "tarjeta roja", expulsado, "cartão vermelho", expulso, "carton rouge", expulsé,
               "rote karte", "gelb-rot", "platzverweis", "cartellino rosso", espulso]
    yellow_card: ["yellow card", booked, booking, "into the book", "tarjeta amarilla",
                  amonestado, "cartão amarelo", "carton jaune", "averti", "gelbe karte",
                  verwarnt, "cartellino giallo", ammonito]
    var: [VAR, "video review", "video assistant", "on-field review", "check complete",
          "to the monitor", revisión, "revisão", "videobeweis", "vidéo assistance"]
    free_kick: ["free kick", "free-kick", "tiro libre", "falta directa", "cobrança de falta",
                "coup franc", "freistoß", "freistoss", punizione]
    corner: [corner, córner, "saque de esquina", escanteio, "coup de pied de coin", ecke,
             eckball, "calcio d'angolo", angolo]
    offside: [offside, "off side", "fuera de juego", impedimento, "hors-jeu", "hors jeu",
              abseits, fuorigioco]
    injury: [injury, injured, stretcher, "needs treatment", lesión, lesionado, "lesão",
             "blessure", "blessé", verletzung, verletzt, infortunio]
    substitution: [substitution, "comes on", "coming on", "comes off", "replaced by", "makes way",
                   sustitución, "substituição", remplacement, wechsel,
                   "eingewechselt", sostituzione]
    kickoff: ["kick off", "kick-off", "kicks off", underway, "we're underway", "pitido inicial",
              "coup d'envoi", anstoß, anstoss, "calcio d'inizio"]
    halftime: ["half time", "half-time", halftime, descanso, "medio tiempo", intervalo,
               "mi-temps", halbzeit, "halbzeitpfiff", intervallo]
    fulltime: ["full time", "full-time", fulltime, "final whistle", "it's all over", "final del partido",
               "fim de jogo", "coup de sifflet final", abpfiff, "fischio finale"]
  patterns:
    goal: ['\bgo+o+a+l+\b', '\bgo+o+l+\b', '\bto+o+r+\b']

  # Words the broadcast writes on screen for a moment (analysis/game_text.py
  # reads them; the score bug itself is read by sports/soccer/scoreboard.py).
  # Off: on a broadcast final, reading the screen at the loudest moments took
  # 115 s and found none of them, since graphics like these come up later, in
  # the replays and the review, and the score box already confirms the goals.
  read_screen: false
  screen_text: [GOAL, GOL, TOR, BUT, "OWN GOAL", PENALTY, PENALTI, ELFMETER, RIGORE, VAR,
                "VAR CHECK", "NO GOAL", "GOAL CONFIRMED", "RED CARD", "YELLOW CARD", OFFSIDE,
                SUBSTITUTION, "HALF TIME", "HALF-TIME", "FULL TIME", "FULL-TIME", "TARJETA ROJA",
                "CARTON ROUGE", "ROTE KARTE"]

  # How much each sound group (config/gaming.yaml's sound_groups) means here,
  # 0-1. The crowd is the strongest cue in stadium sport; the whistle stops
  # play for fouls, cards and the end of each half.
  sounds: {gunfire: 0.0, explosion: 0.2, crash: 0.1, crowd: 1.0, whistle: 0.8, scream: 0.6,
           laughter: 0.2}

  # The 9:16 framing's ball and player detector (sports/soccer/ball.py).
  # Measured on 200 frames of a broadcast final: in the 123 wide shots the
  # shipped yolov8n found the ball in 35 at 640 px, 77 at 960 and 90 at
  # 1280 (34 ms a frame on the GPU); yolov8s, a 22 MB download, found 78 at
  # 1280 and was slower. A broadcast ball is a few pixels wide, so the input
  # size matters more than the model.
  framing: {model: yolov8n.pt, imgsz: 1280}

  # What the Highlights choice keeps: the event types it selects, and (for
  # "Goals + celebrations") extra seconds kept after the moment. `all` keeps
  # every type, best first.
  highlights_choices:
    best:               {label: Best moments,         events: all}
    goals:              {label: All goals,            events: [goal, penalty_goal, own_goal]}
    goals_celebrations: {label: Goals + celebrations, events: [goal, penalty_goal, own_goal], post_extra: 12}
    saves:              {label: Best saves,           events: [save, penalty_miss]}
    chances:            {label: Best chances,         events: [chance, shot, penalty_miss]}
    attacking:          {label: Attacking plays,      events: [goal, penalty_goal, own_goal, chance, shot, penalty, free_kick, corner, big_moment]}
    cards:              {label: Cards,                events: [red_card, yellow_card, var]}
    penalties:          {label: Penalties,            events: [penalty, penalty_goal, penalty_miss]}
    custom:             {label: Custom,               events: all}

  periods:
    full:        Full match
    first_half:  1st half
    second_half: 2nd half
    extra_time:  Extra time

  # What kind of footage: a TV broadcast (a score box, commentary, a
  # stadium's crowd) or a club camera or a phone at the touchline (none of
  # those). Automatic takes a match with no score box on screen as the
  # second.
  footage_choices:
    auto:      Automatic
    broadcast: TV broadcast
    sideline:  Club or phone

# Basketball: the second sport, on the same framework. A basket the score bug
# confirms is ground truth (the score goes up by 1, 2 or 3), the quarter and
# the game clock say how much it mattered, and the broadcast's cutaways to the
# crowd, the bench and courtside are reactions tied to the play before them.
# Sources: WSC Sports (the NBA's automated highlights, crowd reaction as a
# signal), BARD's multi-label action set (shot type and result, team, player),
# basketball_event_tracking's split of player, ball and possession, and
# LumenSport's separate segmenting, scoring and editing. Ideas only; nothing
# copied, and no NBA tracking data is assumed.
basketball:
  label: Basketball

  highlights: >-
    dunks and alley-oops, threes, and-ones, blocks, steals that turn into a basket, game winners
    and buzzer-beaters, clutch shots in a close game late in the fourth or in overtime, big runs and
    lead changes, and the crowd, bench and courtside reactions to them

  # The arena reacts within a second of the basket, a little faster than a
  # stadium: the ball drops through and the noise is already there.
  crowd_lag_seconds: 1.0
  # Basketball replays come quickly, in the next dead ball.
  replay_within_seconds: 40
  # Play restarts within seconds of a basket, so a second scoring moment
  # more than this after one is another basket, not its celebration.
  celebration_seconds: 10
  replay_words: [replay, replays, "look at this again", "watch it again", "see it again", "one more time",
                 "another angle", "slow motion", "in slow-mo", "let's take another look", repetición]

  # What a new score confirms. The scoreboard reads the points (1, 2 or 3)
  # and the profile names the basket (sports/basketball/profile.py).
  scoring_events: [made_2, made_3, free_throw, dunk, alley_oop, and_one, putback, tip_in, poster_dunk,
                   fast_break_score, buzzer_beater, game_winner, game_tying, go_ahead, clutch_shot,
                   corner_three, deep_three, step_back, fadeaway, pull_up, isolation_score,
                   difficult_finish, euro_step, layup]

  # The taxonomy: every kind of moment, its worth and its window. It is data:
  # a new kind is a line here (and words under `callouts`), no code. The
  # game's situation then lifts or lowers a moment's worth (the profile's
  # context_weight): a game-winning three is not a first-quarter three.
  events:
    # Scoring
    game_winner:      {label: Game winner,       importance: 100, pre: 14, post: 14}
    buzzer_beater:    {label: Buzzer-beater,     importance: 98,  pre: 12, post: 12}
    poster_dunk:      {label: Poster dunk,       importance: 95,  pre: 8,  post: 8}
    alley_oop:        {label: Alley-oop,         importance: 92,  pre: 8,  post: 7}
    game_tying:       {label: Game-tying shot,   importance: 92,  pre: 12, post: 10}
    dunk:             {label: Dunk,              importance: 88,  pre: 8,  post: 7}
    and_one:          {label: And-one,           importance: 85,  pre: 8,  post: 8}
    clutch_shot:      {label: Clutch shot,       importance: 85,  pre: 10, post: 8}
    go_ahead:         {label: Go-ahead basket,   importance: 82,  pre: 10, post: 8}
    deep_three:       {label: Deep three,        importance: 80,  pre: 8,  post: 6}
    fast_break_score: {label: Fast-break score,  importance: 72,  pre: 9,  post: 5}
    made_3:           {label: Three,             importance: 68,  pre: 8,  post: 5}
    corner_three:     {label: Corner three,      importance: 68,  pre: 8,  post: 5}
    isolation_score:  {label: Isolation score,   importance: 66,  pre: 9,  post: 5}
    difficult_finish: {label: Difficult finish,  importance: 66,  pre: 7,  post: 5}
    made_2:           {label: Basket,            importance: 50,  pre: 7,  post: 4}
    layup:            {label: Layup,             importance: 50,  pre: 7,  post: 4}
    free_throw:       {label: Free throw,        importance: 20,  pre: 3,  post: 3}
    # Shooting
    step_back:        {label: Step-back,         importance: 70,  pre: 7,  post: 5}
    fadeaway:         {label: Fadeaway,          importance: 66,  pre: 7,  post: 5}
    pull_up:          {label: Pull-up,           importance: 58,  pre: 7,  post: 5}
    contested_shot:   {label: Contested shot,    importance: 55,  pre: 6,  post: 5}
    attempt_3:        {label: Three attempt,     importance: 30,  pre: 6,  post: 4}
    attempt_2:        {label: Shot attempt,      importance: 25,  pre: 6,  post: 4}
    miss:             {label: Miss,              importance: 25,  pre: 6,  post: 4}
    # Defense
    block:            {label: Block,             importance: 78,  pre: 6,  post: 8}
    steal:            {label: Steal,             importance: 74,  pre: 5,  post: 10}
    charge:           {label: Charge taken,      importance: 60,  pre: 6,  post: 6}
    defensive_stop:   {label: Defensive stop,    importance: 55,  pre: 10, post: 5}
    deflection:       {label: Deflection,        importance: 45,  pre: 5,  post: 6}
    shot_contest:     {label: Shot contest,      importance: 40,  pre: 5,  post: 4}
    transition_defense: {label: Transition defense, importance: 50, pre: 6, post: 5}
    # Rebounding
    putback:          {label: Putback,           importance: 70,  pre: 6,  post: 5}
    tip_in:           {label: Tip-in,            importance: 62,  pre: 6,  post: 5}
    offensive_rebound: {label: Offensive rebound, importance: 45, pre: 6,  post: 5}
    defensive_rebound: {label: Rebound,          importance: 25,  pre: 6,  post: 4}
    # Passing and creation
    alley_oop_assist: {label: Alley-oop pass,    importance: 80,  pre: 8,  post: 6}
    no_look_pass:     {label: No-look pass,      importance: 72,  pre: 7,  post: 5}
    dime:             {label: Great pass,        importance: 65,  pre: 7,  post: 5}
    cross_court_pass: {label: Cross-court pass,  importance: 50,  pre: 7,  post: 5}
    assist:           {label: Assist,            importance: 50,  pre: 7,  post: 5}
    pick_and_roll:    {label: Pick-and-roll,     importance: 45,  pre: 8,  post: 5}
    # Ball handling and individual plays
    ankle_breaker:    {label: Ankle breaker,     importance: 85,  pre: 7,  post: 6}
    crossover:        {label: Crossover,         importance: 62,  pre: 6,  post: 5}
    behind_the_back:  {label: Behind-the-back,   importance: 60,  pre: 6,  post: 5}
    spin_move:        {label: Spin move,         importance: 58,  pre: 6,  post: 5}
    euro_step:        {label: Euro step,         importance: 58,  pre: 6,  post: 5}
    # Game events
    ejection:         {label: Ejection,          importance: 80,  pre: 12, post: 12}
    fight:            {label: Confrontation,     importance: 78,  pre: 10, post: 15}
    flagrant_foul:    {label: Flagrant foul,     importance: 70,  pre: 8,  post: 12}
    challenge:        {label: Coach's challenge, importance: 55,  pre: 6,  post: 12}
    technical_foul:   {label: Technical foul,    importance: 55,  pre: 8,  post: 10}
    controversial_call: {label: Controversial call, importance: 60, pre: 8, post: 12}
    injury:           {label: Injury,            importance: 30,  pre: 6,  post: 8}
    shot_clock:       {label: Shot-clock beater, importance: 50,  pre: 8,  post: 4}
    shooting_foul:    {label: Shooting foul,     importance: 35,  pre: 6,  post: 5}
    foul:             {label: Foul,              importance: 25,  pre: 6,  post: 4}
    overtime:         {label: Overtime,          importance: 30,  pre: 6,  post: 6}
    game_end:         {label: Game end,          importance: 40,  pre: 8,  post: 12}
    quarter_end:      {label: End of quarter,    importance: 20,  pre: 8,  post: 5}
    halftime:         {label: Halftime,          importance: 10,  pre: 6,  post: 4}
    timeout:          {label: Timeout,           importance: 10,  pre: 4,  post: 4}
    substitution:     {label: Substitution,      importance: 10,  pre: 3,  post: 4}
    # Reactions (sports/basketball/reactions.py): a cutaway from the court
    # after a play, tied to that play. Their windows run from the play just
    # before to the end of the shot; these are for one with no play to tie to.
    celebrity_reaction: {label: Celebrity reaction, importance: 75, pre: 3, post: 3}
    courtside_reaction: {label: Courtside reaction, importance: 65, pre: 3, post: 3}
    bench_reaction:   {label: Bench reaction,    importance: 62,  pre: 3,  post: 3}
    coach_reaction:   {label: Coach reaction,    importance: 55,  pre: 3,  post: 3}
    crowd_reaction:   {label: Crowd reaction,    importance: 58,  pre: 3,  post: 3}
    fan_reaction:     {label: Fan reaction,      importance: 55,  pre: 3,  post: 3}
    player_reaction:  {label: Player reaction,   importance: 50,  pre: 3,  post: 3}
    big_moment:       {label: Big moment,        importance: 55,  pre: 8,  post: 6}

  # The reaction types, which the Fan reaction choices keep and which a play
  # absorbs when its reaction fits in the clip.
  reaction_events: [celebrity_reaction, courtside_reaction, bench_reaction, coach_reaction, crowd_reaction,
                    fan_reaction, player_reaction]

  # What the commentary says, English first (most basketball broadcasts),
  # with the common Spanish and French. Whole words, ignoring case. Plain
  # "three" ("three seconds left") and "shot" are left out on purpose.
  callouts:
    game_winner: ["game winner", "game-winner", "game winning", "game-winning", "for the win", "wins it",
                  "wins the game", "walk-off", "canasta ganadora", "panier de la gagne"]
    buzzer_beater: ["buzzer beater", "buzzer-beater", "at the buzzer", "beats the buzzer", "beat the buzzer",
                    "before the buzzer", "on the horn", "at the horn", "sobre la bocina", "au buzzer"]
    game_tying: ["ties it", "ties the game", "tie game", "all tied up", "we're tied", "game is tied", "knots it"]
    go_ahead: ["go-ahead", "go ahead bucket", "takes the lead", "gives them the lead", "lead change",
               "back in front", "retakes the lead"]
    clutch_shot: [clutch, "ice in his veins", "ice in her veins", "cold-blooded", "cold blooded", "dagger"]
    poster_dunk: [poster, posterized, posterizes, "on his head", "on her head", "in his face", "over the top of"]
    alley_oop: ["alley-oop", "alley oop", "lob city", "throws it up", "off the lob"]
    dunk: [dunk, dunks, slam, "slams it", "throws it down", "throw down", jam, "jams it", "hammers it",
           "tomahawk", "windmill", "flushes it", clavada]
    and_one: ["and one", "and-one", "and 1", "plus the foul", "and the foul", "with the foul",
              "chance for the three-point play", "three-point play", "más uno", "plus un"]
    deep_three: ["from the logo", "logo three", "from way downtown", "way downtown", "from deep", "deep three",
                 "from the parking lot", "from the volcano", "half court", "half-court", "from halfcourt"]
    corner_three: ["corner three", "from the corner", "corner 3"]
    made_3: ["from downtown", "for three", "for 3", "three-pointer", "three pointer", "from three",
             "from beyond the arc", "splash", "nothing but net",
             "triplazo", "de tres", "à trois points"]
    made_2: ["he scores", "she scores", "bucket", "buckets", "lays it in", "layup", "lay-up", "finger roll",
             "floater", "banks it in", "off the glass", "jumper", "canasta", "panier"]
    fast_break_score: ["fast break", "in transition", "on the break", "coast to coast", "coast-to-coast",
                       "leak out", "contraataque", "contre-attaque"]
    free_throw: ["free throw", "free throws", "at the line", "to the line", "from the line", "tiro libre",
                 "lancer franc"]
    step_back: ["step back", "step-back", "stepback"]
    fadeaway: [fadeaway, "fade away", "fall-away", "fallaway"]
    pull_up: ["pull-up", "pull up", "pulls up"]
    isolation_score: ["one on one", "one-on-one", "isolation", "iso", "takes him off the dribble"]
    difficult_finish: ["what a finish", "acrobatic", "how did that go in", "circus shot", "double clutch",
                       "reverse layup", "up and under", "and he finishes"]
    euro_step: ["euro step", "euro-step", "eurostep"]
    contested_shot: ["contested", "tough shot", "hand in his face", "hand in her face", "over the outstretched"]
    miss: [misses, "no good", "off the rim", "rims out", "rimmed out", "in and out", "airball", "air ball",
           "can't get it to fall", "falla"]
    block: [block, blocked, blocks, rejected, rejection, "swatted", swat, "get that out of here",
            "denied", "sends it back", "pinned", "chase-down", "chasedown", tapón]
    steal: [steal, steals, stolen, "picked off", "picks his pocket", "picks her pocket", "pickpocket",
            "takes it away", "intercepted", robo, interception]
    deflection: [deflection, deflected, "gets a hand on it", "tipped away"]
    charge: ["takes the charge", "taking the charge", "offensive foul", "charging", "charge"]
    defensive_stop: ["big stop", "defensive stop", "get the stop", "gets the stop", "great defense",
                     "shot clock violation", "turnover"]
    putback: [putback, "put back", "put-back", "putback dunk", "cleans it up", "second chance"]
    tip_in: ["tip in", "tip-in", "tips it in", "tip slam"]
    offensive_rebound: ["offensive rebound", "offensive board", "crashes the glass", "keeps it alive"]
    defensive_rebound: [rebound, "pulls down the board", "grabs the board", rebote, rebond]
    alley_oop_assist: ["lob to", "throws the lob", "finds him for the lob"]
