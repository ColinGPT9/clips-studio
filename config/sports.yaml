                "EJECTED", "BONUS", "FOUL"]

  # The buzzer, as a sound of basketball's own (sports.sound_groups adds it
  # to the app's groups for a basketball match only, so it never changes how
  # a game is scored).
  sound_groups:
    buzzer: {label: a buzzer, side: game, classes: [Buzzer, "Air horn, truck horn"]}
  curves: [crowd, whistle, buzzer]
  sounds: {gunfire: 0.0, explosion: 0.1, crash: 0.1, crowd: 1.0, whistle: 0.6, buzzer: 0.7, scream: 0.5,
           laughter: 0.2}

  # The 9:16 framing's detector (sports/basketball/action.py). Measured on
  # three NBA games, 1280 px found the real ball in 14%, 40% and 33% of wide
  # samples, against 9%, 39% and 18% at 960. hide_scoreboard leaves the TV
  # scoreboard out of the crop (zooming in a little) rather than cut it in half.
  framing: {model: yolov8n.pt, imgsz: 1280, hide_scoreboard: true}

  # Telling a cutaway (the crowd, the bench, courtside) from the court
  # (sports/basketball/reactions.py), measured on three NBA games: a shot
  # whose tallest person is at least `people_tall` of the frame's height is
  # people, the court's players being 0.18-0.33 of it from the stands. The
  # colour and edge test only stands in when the detector can't load; it
  # can't tell them apart well (the lower half of a court shot is the front
  # rows), and these are its best values on those games.
  reactions:
    people_tall: 0.36      # a shot whose tallest person is this tall is people, not the court
    court_share: 0.20      # without the detector: at least this much one colour in the lower half is the court...
    crowd_edges: 0.255     # ...and at least this share of edge pixels there is a crowd
    react_within: 10       # a cutaway starting this many seconds after a play is its reaction; later, the next
                           # possession is under way (8 s to cross half court): on an NBA game, cutaways 13-16 s
                           # after a basket came after the next play
    names_from_screen: true  # a name the broadcast captions over a cutaway is kept with it

  # A typed line's words ("1:23:14 dunk LeBron"). Basketball's own, so "ft"
  # is a free throw and "3" isn't a match minute; times are the video's.
  match_minutes: false
