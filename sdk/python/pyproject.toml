# The Clips Kitty plugin SDK as an installable package, for developing a
# plugin outside the app. Clips Kitty itself never installs it: the app puts
# its own copy on each plugin's PYTHONPATH (plugins/runner.py). Not published
# to PyPI; install it from this repository (sdk/python/README.md).
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clipskitty-sdk"
dynamic = ["version"]
description = "Write pipelines for Clips Kitty: read the job, report progress, return moments, check the manifest."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6"]

[project.urls]
Documentation = "https://github.com/ColinGPT9/clips-studio/blob/main/docs/developers/sdk.md"
Source = "https://github.com/ColinGPT9/clips-studio/tree/main/sdk/python"

[tool.setuptools]
packages = ["clipskitty_sdk"]

[tool.setuptools.package-data]
clipskitty_sdk = ["schema/*.json"]

[tool.setuptools.dynamic]
version = {attr = "clipskitty_sdk.__version__"}
