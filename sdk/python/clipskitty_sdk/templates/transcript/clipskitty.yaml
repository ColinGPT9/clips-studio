# yaml-language-server: $schema=https://raw.githubusercontent.com/ColinGPT9/clips-studio/main/sdk/python/clipskitty_sdk/schema/clipskitty.schema.json
# What Clips Kitty reads about this plugin. Every field is described in
# https://github.com/ColinGPT9/clips-studio/blob/main/docs/developers/plugin-manifest.md
manifest_version: 1
id: @@ID@@
name: "@@NAME@@"
version: 0.1.0
kind: pipeline
capability: highlight_detection
description: >
  Finds the moments where the commentary says one of your words or phrases,
  such as "quark burst" in Quarkbloom Arena (a made-up game). It only reads
  what is said: it doesn't see the screen, and it can't tell whether the
  words are about what is happening.
author: {name: "@@AUTHOR@@"}
license: "@@LICENSE@@"
requires: {clips_kitty: "@@REQUIRES@@", plugin_api: 1}
run:
  command: ["{python}", "src/main.py"]
execution: local
inputs: [transcript]
outputs: [ranges]
events: [words_said]
settings:
  words:
    type: string
    default: "quark burst, triple bloom"
    max_length: 1000
    title: Words or phrases to look for, separated by commas
  lead_in_seconds:
    type: number
    default: 10
    minimum: 0
    maximum: 60
    title: Seconds to keep before the words are said
permissions: [transcript.read]
network: []
sends: []
requirements: {gpu: none, os: [windows, macos, linux]}
category: gaming
