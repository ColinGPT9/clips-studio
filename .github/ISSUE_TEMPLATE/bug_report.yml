name: 🐞 Bug report
description: Something broke or looks wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Tip: if you use Clips Kitty, the in-app
        **💬 Feedback** button on the Dashboard files this for you and
        attaches your versions/hardware/log automatically — it is quicker
        than this form and fills in the diagnostics below for you.
  - type: input
    id: source
    attributes:
      label: The video you were processing
      description: >-
        Paste the exact link, or say "local file" and give the length, and what
        it is (a stream VOD, a talking-head upload, gameplay). Without this a
        report usually cannot be acted on: the same step fails for different
        reasons on different footage, and guessing which is not possible from a
        description alone.
      placeholder: https://... or "local file, 42 min talking head"
    validations:
      required: true
  - type: textarea
    id: trying
    attributes:
      label: What were you trying to do?
      description: The steps you took, in order, so it can be repeated exactly.
      placeholder: |
        1. Pasted the link into the queue
        2. Pressed Generate
        3. It ran for about 4 minutes and finished with no clips
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened?
      description: >-
        Include any error text exactly as it appeared, even if it looks like
        nonsense. The precise wording is usually what identifies the cause.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: repro
    attributes:
      label: Can you make it happen again?
      options: [Always, Sometimes, Only once]
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: How serious is it?
      options: [Low — cosmetic, Medium, High — blocks my work, Critical — app unusable]
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        **The in-app 💬 Feedback button collects all of this for you** — paste
        what it produced. Without it, a bug can rarely be reproduced, and a
        report nobody can reproduce usually cannot be fixed.

        Filling it in by hand instead? These six, please:

        - Clips Kitty version (Settings → bottom of the page)
        - Windows version
        - CPU
        - GPU and how much VRAM it has
        - RAM
        - Where the video came from — Twitch, Kick, YouTube or a local file
      placeholder: |
        Clips Kitty: 1.1.3
        Windows: 11
        CPU: Intel Core i5-13400F
        GPU: RTX 3060 12 GB
        RAM: 32 GB
        Source: local file
      render: text
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else?
      description: >
        Screenshots, the log from Settings → Open logs folder, or anything
        else that might matter. Optional.
