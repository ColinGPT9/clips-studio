# Puts a "Sponsor" button at the top of the repository page and in the
# sidebar, next to Watch and Fork. GitHub reads this file automatically; there
# is nothing to enable.
#
# PayPal is not one of GitHub's built-in platforms, so it goes under `custom`,
# which renders as a plain link in the sponsor panel. Everything else is left
# out rather than listed empty — a blank platform key makes GitHub skip the
# whole file.

custom: ['https://paypal.me/clipsstudio']
