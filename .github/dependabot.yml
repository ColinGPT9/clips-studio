# Dependency updates.
#
# Grouped and throttled on purpose. Ungrouped Dependabot on a project with
# this many dependencies opens a dozen PRs a week and everyone starts
# ignoring them — which is worse than not running it, because the security
# ones get ignored too.

version: 2

updates:
  # ---- desktop app ---------------------------------------------------
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Electron and the build tooling move together and are best reviewed
      # in one go, since they only matter when packaging.
      build-tooling:
        patterns:
          - 'electron*'
          - 'vite'
          - '@vitejs/*'
          - 'typescript'
      # Everything else, patch and minor only — a major React bump should be
      # a deliberate decision, not a Monday morning PR.
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Same rule as the engine: no majors. Electron 31 -> 43 is twelve major
      # versions and would need the packaging chain re-tested end to end
      # (nsis-web, the unsigned-build workaround, the rcedit icon hook).
      # Worth doing one day, on purpose, not as a drive-by merge.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # ---- python engine -------------------------------------------------
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # yt-dlp releases constantly because sites change; it is also the one
      # dependency you WANT current, so it is left ungrouped and unthrottled
      # rather than batched into a weekly roll-up.
      - dependency-name: yt-dlp
        update-types: ['version-update:semver-patch']
      # No major bumps, for anything. requirements.txt caps majors, so these
      # PRs could not be merged without also raising a ceiling — which is a
      # decision to make deliberately, after processing a real video, not one
      # to be nudged into by a Monday morning pull request.
      #
      # This is why eleven branches piled up: opencv 4->5, psutil 5->7,
      # electron 31->43. All of them wanted a major.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # ---- the workflows themselves --------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - '*'
