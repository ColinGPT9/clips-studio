# Publishes the engine image, so contributors do not have to build it.
#
# Building it locally is ten minutes of PyTorch and OpenCV. Pulling it is
# about two. That difference is roughly the difference between someone
# trying the project and closing the tab, which is why this exists.
#
# Deliberately NOT on every push to main. Pushing a ~3 GB image on every
# commit burns storage and minutes for no one's benefit; the engine's
# dependencies change a few times a year. Run it when they do:
#
#   Actions -> Publish engine image -> Run workflow
#
# It also runs on a release tag, so every release has a matching image.

name: Publish engine image

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The image is bigger than a runner's free disk once layers and the
      # build cache are counted. These preinstalled toolchains are worth
      # ~20 GB and nothing here uses them.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          # Lowercase: GHCR rejects capitals in a repository name, and the
          # owner here has them.
          images: ghcr.io/${{ github.repository_owner }}/clips-studio-engine
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # linux/amd64 only. arm64 would need emulation for a CUDA-adjacent
          # dependency stack and take the better part of an hour; Apple
          # Silicon users can still build locally with `--build`.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
