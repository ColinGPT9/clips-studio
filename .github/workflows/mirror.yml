# Mirror the project so people can find it somewhere other than GitHub.
#
# Two different kinds of mirror:
#   * the SITE  -> a Hugging Face static Space (site/ becomes the Space root)
#   * the REPO  -> GitLab, full history
#
# Every job is skipped unless its secret exists, so this workflow is safe to
# merge before any account is set up — it just does nothing. Add a secret and
# that mirror starts working on the next push. See docs/MIRRORS.md.

name: Mirror

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------- website
  huggingface-space:
    name: Website → Hugging Face Space
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Push site/ to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }} # e.g. ColinGPT9/clips-studio
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "HF_TOKEN or HF_SPACE not set — skipping."
            exit 0
          fi
          # The Space wants index.html at ITS root, so site/ is pushed as the
          # whole tree rather than as a subdirectory.
          cd site
          git init -q
          git config user.name "clips-studio-bot"
          git config user.email "noreply@github.com"
          git add -A
          git commit -q -m "Sync website from ${GITHUB_SHA::7}"
          git push -q --force \
            "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" \
            HEAD:main
          echo "Pushed site/ to https://huggingface.co/spaces/${HF_SPACE}"

  # ---------------------------------------------------------------- code
  gitlab:
    name: Repo → GitLab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # mirrors need the whole history, not a shallow clone

      - name: Push to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_REPO: ${{ secrets.GITLAB_REPO }} # e.g. colingpt9/clips-studio
        run: |
          if [ -z "$GITLAB_TOKEN" ] || [ -z "$GITLAB_REPO" ]; then
            echo "GITLAB_TOKEN or GITLAB_REPO not set — skipping."
            exit 0
          fi
          git push --force \
            "https://oauth2:${GITLAB_TOKEN}@gitlab.com/${GITLAB_REPO}.git" \
            HEAD:main
          echo "Pushed to https://gitlab.com/${GITLAB_REPO}"
