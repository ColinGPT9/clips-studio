# Mirror the website to a Hugging Face static Space, so it is findable
# somewhere other than GitHub Pages. site/ becomes the Space root.
#
# Skipped unless the secrets exist, so this is safe to have merged before any
# account is set up — it just does nothing. Add the secrets and it starts
# working on the next push. See docs/MIRRORS.md.
#
# A GitLab repo mirror used to live here too and was removed: maintaining a
# second copy of the code costs attention, and nobody was looking for the
# project there.

name: Mirror

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege. Without this the job inherits whatever the repository
# default is, which is write access to everything — for a workflow whose only
# job is to read site/ and push it somewhere else with its own token.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- website
  huggingface-space:
    name: Website → Hugging Face Space
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Push site/ to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }} # e.g. ColinGPT9/clips-studio
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "HF_TOKEN or HF_SPACE not set — skipping."
            exit 0
          fi
          # The Space wants index.html at ITS root, so site/ is pushed as the
          # whole tree rather than as a subdirectory.
          cd site
          git init -q
          git lfs install --local

          # Hugging Face refuses binary blobs pushed as ordinary git objects:
          # "Your push was rejected because it contains binary files." The
          # mascot PNGs tripped it. Images have to go through LFS/Xet, and that
          # needs .gitattributes in place BEFORE `git add`, or the files are
          # staged as plain blobs and the filter never runs.
          #
          # Written here rather than committed as site/.gitattributes on
          # purpose: a real one would make GitHub start LFS-tracking the same
          # PNGs in this repository, which nothing here wants. This copy exists
          # only in the throwaway repo created by `git init` two lines up.
          for ext in png jpg jpeg gif webp svg ico mp4 webm woff woff2; do
            echo "*.${ext} filter=lfs diff=lfs merge=lfs -text" >> .gitattributes
          done

          git config user.name "clips-studio-bot"
          git config user.email "noreply@github.com"
          git add -A
          git commit -q -m "Sync website from ${GITHUB_SHA::7}"
          git push -q --force \
            "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" \
            HEAD:main
          echo "Pushed site/ to https://huggingface.co/spaces/${HF_SPACE}"
