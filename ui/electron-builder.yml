# Windows installer for Clips Studio.
#
# Produces an NSIS installer that carries everything the app needs: the
# Electron front end, the frozen Python engine, FFmpeg, and the YOLO
# weights. A creator installs it and pastes a link — no Python, no PATH,
# no terminal.
#
# Built by scripts/build_installer.py, which freezes the backend first and
# leaves it in build/dist/backend/ for the extraResources rule below.

appId: com.clipsstudio.app
productName: Clips Studio
copyright: Copyright © 2026 ColinGPT9

directories:
  output: ../release
  buildResources: build

# Embeds build/icon.ico into the packaged .exe. electron-builder would
# normally do this itself, but the tool it uses ships in the same archive as
# the macOS symlinks that an ordinary Windows account cannot extract — see
# signAndEditExecutable below. Without this the app keeps Electron's default
# atom icon on the shortcut, taskbar and Alt-Tab.
afterPack: build/afterPack.cjs

files:
  - out/**/*
  - package.json

# Everything that is not JavaScript rides along here. asar would corrupt the
# native DLLs in the backend, so these stay as plain files on disk.
extraResources:
  # The frozen Python engine. Electron spawns resources/backend/api.exe —
  # see startBackend() in src/main/index.ts.
  #
  # FFmpeg rides along inside this folder: the PyInstaller spec already
  # places it at _internal/ffmpeg/, which core.binaries searches relative to
  # the executable. Copying vendor/ffmpeg again here would ship a second
  # 204 MB copy of the same two binaries.
  - from: ../build/dist/backend
    to: backend
    filter:
      - "**/*"

win:
  # nsis-web, not plain nsis. makensis.exe is a 32-bit program: it memory-maps
  # the payload to embed it in the installer, so it dies at roughly 2 GB with
  # "failed creating mmap". This app is ~5 GB unpacked, almost all of it CUDA
  # PyTorch, so a single-file installer is not possible at all.
  #
  # A web installer is the better answer anyway at this size: the setup .exe
  # is small and starts instantly, and the big download is resumable — which
  # matters a lot when it is several gigabytes over a home connection.
  #
  # The zip target is the offline fallback: no installer, no shortcuts, but
  # it works with no network and can be copied onto a machine by hand.
  target:
    - target: nsis-web
      arch:
        - x64
    - target: zip
      arch:
        - x64
  artifactName: ClipsStudio-${version}-${arch}.${ext}
  # No code-signing certificate yet. Windows SmartScreen will warn on first
  # run until the installer builds reputation or a certificate is bought —
  # documented in the release notes so it doesn't look like a virus.
  #
  # Skipping the sign-and-edit step keeps the build working on an ordinary
  # Windows account. electron-builder otherwise downloads a signing bundle
  # that contains macOS symlinks, and extracting those needs Developer Mode
  # or admin rights — it fails with "Cannot create symbolic link: A required
  # privilege is not held by the client" on a normal machine.
  #
  # The cost is that the app .exe carries no embedded icon or version
  # metadata. To get those back once there is an icon and a certificate:
  # turn on Windows Developer Mode (Settings > System > For developers),
  # then delete this line.
  signAndEditExecutable: false

# These apply to the web installer too — nsisWeb inherits from nsis.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Clips Studio
  # The payload is several gigabytes, so give the user a real progress
  # dialog rather than a frozen window.
  deleteAppDataOnUninstall: false
  # Leaving data/ behind on uninstall is deliberate: it holds the creator's
  # downloaded videos, rendered clips and learned creator profiles. Removing
  # a program should never delete someone's footage.

nsisWeb:
  artifactName: ClipsStudio-Web-Setup-${version}.${ext}

compression: maximum

# Auto-update wiring. The update wizard (roadmap item 4) reads this feed;
# publishing is manual until releases start.
publish:
  - provider: github
    owner: ColinGPT9
    repo: clips-studio
    releaseType: draft
